# /etc/nginx/sites-available/beta.emcfunleague.com
# Template — certbot will inject the 443 server block + HTTP->HTTPS redirect
# when you run `sudo certbot --nginx -d beta.emcfunleague.com`.
server {
    listen 80;
    server_name beta.emcfunleague.com;

    location /static/ {
        alias /var/www/beta.emcfunleague.com/source/staticfiles/;
    }

    location /media/ {
        alias /var/www/beta.emcfunleague.com/source/media/;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn.beta.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
