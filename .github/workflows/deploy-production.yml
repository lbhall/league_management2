name: Deploy production

# Production is a manual promotion. Every merge to main auto-deploys to beta
# (see ci.yml); once the change is verified on beta.emcfunleague.com, run this
# workflow from the Actions tab to release the current main to production.
on:
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 56 emcfunleague.com >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 56 bhall@emcfunleague.com \
            'bash /var/www/emcfunleague.com/source/deploy.sh'
